name: "4. Unsolvable"
source: "research 09 section 7, scenario 4"
note: >
  Action order puts the lender request first: it has a deadline and a consequence, and the spoken
  explanation only covers the top two. Nothing is pruned while an obligation goes unpaid, so all
  three cuts stay -- every rupee they save is a rupee that could pay an obligation.
  Research 09 expects the 9,000 personal EMI to be the casualty and the 500 card minimum to be
  paid. It is the other way round here, and deliberately: a card minimum ranks below an unsecured
  instalment, so the 500 waits and the 9,000 EMI is kept current. Paying the 500 on 25 September
  would leave the EMI 500 short on 5 October, which costs penal charges, a thirty day mark and
  eventually the asset, against one late fee on the card.
