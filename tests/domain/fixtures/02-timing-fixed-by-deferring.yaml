name: "2. Timing shortfall fixed by deferring"
source: "research 09 section 7, scenario 2, with the context7 appendix corrections"
note: >
  The appendix quotes the BEFORE-actions minimum, -5,800 on 09-29, and -800 on 09-29 after the
  deferral alone. Summary.lowest_balance is the FINAL plan, so it is 2,200 on 09-29 here.
  The appendix names 10-01 as the deferral target without deriving it; the rule in the brief is
  "the first day the balance recovers", which is 09-30, the day the salary lands.
  Research 09 calls this TIMING, and the classification still is: net is +27,000. The status is
  UNSOLVABLE because the engine no longer moves a lender's due date on the user's behalf. The
  3,000 EMI cannot be paid on 09-25, so it is reported unpaid on its own date with one ASK_LENDER
  action; the money exists on 09-30, which is what the request is for. Closing is 30,000 rather
  than 27,000 precisely because that 3,000 has not left the account.
