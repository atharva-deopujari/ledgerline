name: "10. Income date is a range"
source: "research 09 section 7, scenario 10, with the context7 appendix corrections"
note: >
  The appendix corrects the BEFORE-actions minimum to -5,000 on 09-30, first negative day 09-20.
  The 4,000 EMI cannot be paid on 09-20, and the engine does not move a lender's date, so it is
  reported uncovered there with one ASK_LENDER naming 10-01 as the first day the money exists.
  The dip is not the EMI's fault either way: 200/day of groceries outruns a 3,000 opening balance.
  The last five days of grocery money before the salary, 1,000 of it, are uncovered too, and are
  named rather than shown as a negative balance. Status stays TIMING: the month balances at
  +28,000, nothing is missing except the money arriving sooner. provisional is true because a
  latest_date was assumed.
