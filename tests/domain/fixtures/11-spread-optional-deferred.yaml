name: "11. A spread optional defers as one thing, and only if it earns its place"
source: >
  Session B's paid harness run (docs/process/requests.md). A subscription prorated across the window
  used to emit one DEFER_OPTIONAL per day: twenty actions of 23.33 each for one 700 rupee item.
note: >
  The dip is 09-21 to 09-30: 300 a day of groceries outruns an 8,000 opening balance once the
  4,500 EMI lands on 09-20. Deferring the 700 subscription cannot close a 2,966 dip on its own;
  and the engine does not move a lender's date, so the 4,500 EMI is reported unpaid on 09-20
  with one ASK_LENDER naming 10-01 as the first day the money exists. The subscription deferral
  survives the prune this time: nothing is pruned while an obligation goes unpaid, and here that
  is right -- the 700 it saves is 700 that could go toward the EMI.
