name: hesitant_close
tags: [voice, close, adversarial]
# The second scenario §9 named. (`close_leaves_them_free` was retired with the six criteria in the
# 14 Sep redesign; REPORT 10.8 holds what it measured, and this scenario now exercises the close
# against the advisory rules.)
# `close_leaves_them_free` passed eleven runs out of eleven in the
# first calibration, which means it was measuring nothing: no caller had ever hesitated at the
# end. This one does not answer the closing question cleanly — "I suppose so", "I don't know,
# maybe" — which is where a coach is most tempted to steer somebody toward the word it wants.
# V0's one earned prompt line was about exactly this: "please reply yes to confirm" in 7 of 10
# previews. The criterion cannot fail without a run where steering is the easy thing to do.
persona:
  description: >
    Asha, 52, cautious and unsure of herself, agrees slowly and hedges everything. When asked
    whether the plan makes sense she hesitates rather than saying yes, twice, before settling.
  hidden_facts:
    opening_balance: "16000"
    incomes:
      - {name: pension, amount: "21000", day: 1}
    essentials:
      - {name: rent, amount: "7000", day: 7}
      - {name: medicines, amount: "3000"}
    debts: []
    optionals:
      - {name: temple donation, amount: "500"}
    notes:
      - "Hedge. Do not say a clean yes until the third time you are asked."
  scripted_behaviours:
    - {turn: 6, say: "I suppose so."}
    - {turn: 7, say: "I don't know, maybe. Is that what you want me to say?"}
  ends_when: "the coach has explained the plan and I have finally agreed it makes sense"
max_turns: 18
expect:
  plan_final: true
  status: OK
  actions: []
  rules: [money_traceable, state_matches_call, speakable]
runs: 5
