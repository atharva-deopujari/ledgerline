[project]
name = "ledgerline"
version = "0.1.0"
description = "Real-time voice assistant that plans your next 30 days of money."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pipecat-ai[daily,deepgram]==1.9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "httpx>=0.27",
  "langfuse>=4",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.30",
  "ruff>=0.6",
  "import-linter>=2",
  "pyyaml>=6",
  "hypothesis>=6",
  "playwright>=1.47",
  "tiktoken>=0.14.0",
]
evals = [
  "openai>=1.50",
  "pyyaml>=6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "llm: calls a paid LLM, needs OPENAI_API_KEY",
  "e2e: drives a browser with Playwright",
  "voice: needs live Daily/Deepgram/Cartesia keys",
  "db: needs DATABASE_URL pointing at a Postgres (docker compose up -d postgres); skips otherwise",
]
addopts = "-m 'not llm and not e2e and not voice' -q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "frontend", ".claude"]  # .claude holds editor hooks and a vendored skill, not product code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_package = "ledgerline"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers: api -> voice -> memory -> judge -> agent -> domain"
type = "layers"
layers = ["ledgerline.api", "ledgerline.voice", "ledgerline.memory", "ledgerline.judge", "ledgerline.agent", "ledgerline.domain"]

[[tool.importlinter.contracts]]
name = "judge and memory are pure of infrastructure"
type = "forbidden"
source_modules = ["ledgerline.judge", "ledgerline.memory"]
forbidden_modules = ["pipecat", "fastapi", "psycopg", "langfuse", "opentelemetry", "ledgerline.store", "ledgerline.observability", "ledgerline.voice", "ledgerline.api"]

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["ledgerline.domain"]
forbidden_modules = ["pipecat", "openai", "fastapi", "httpx", "langfuse", "opentelemetry", "psycopg", "ledgerline.agent", "ledgerline.voice", "ledgerline.api", "ledgerline.store", "ledgerline.judge", "ledgerline.memory", "ledgerline.observability"]

[[tool.importlinter.contracts]]
name = "agent never imports pipecat or infrastructure"
type = "forbidden"
source_modules = ["ledgerline.agent"]
forbidden_modules = ["pipecat", "fastapi", "langfuse", "opentelemetry", "psycopg", "ledgerline.store", "ledgerline.judge", "ledgerline.memory", "ledgerline.observability"]


[[tool.importlinter.contracts]]
name = "store imports only domain models and psycopg"
type = "forbidden"
source_modules = ["ledgerline.store"]
forbidden_modules = ["ledgerline.agent", "ledgerline.judge", "ledgerline.memory", "ledgerline.observability", "ledgerline.voice", "ledgerline.api", "ledgerline.config", "pipecat", "openai", "fastapi", "langfuse", "opentelemetry"]

[[tool.importlinter.contracts]]
name = "observability imports only config and domain"
type = "forbidden"
source_modules = ["ledgerline.observability"]
forbidden_modules = ["ledgerline.agent", "ledgerline.judge", "ledgerline.memory", "ledgerline.store", "ledgerline.voice", "ledgerline.api", "pipecat", "fastapi", "psycopg"]

[[tool.importlinter.contracts]]
name = "domain internal layers: cards -> engine -> state -> policy -> models"
type = "layers"
layers = [
  "ledgerline.domain.cards",
  "ledgerline.domain.engine",
  "ledgerline.domain.state",
  "ledgerline.domain.policy",
  "ledgerline.domain.models",
]
